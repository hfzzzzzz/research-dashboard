<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科研记录平台</title>
<style>
/* ============ 设计令牌(参考调色板,浅/深双模式) ============ */
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e;
  --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
  --border:rgba(11,11,11,.10); --border2:rgba(11,11,11,.06);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --delta-good:#006300; --accent:#2a78d6;
  --chip-bg:rgba(11,11,11,.05);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7;
    --muted:#898781; --grid:#2c2c2a; --axis:#383835;
    --border:rgba(255,255,255,.10); --border2:rgba(255,255,255,.06);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --delta-good:#0ca30c; --accent:#3987e5;
    --chip-bg:rgba(255,255,255,.07);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7;
  --muted:#898781; --grid:#2c2c2a; --axis:#383835;
  --border:rgba(255,255,255,.10); --border2:rgba(255,255,255,.06);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --delta-good:#0ca30c; --accent:#3987e5;
  --chip-bg:rgba(255,255,255,.07);
}

*{box-sizing:border-box; margin:0; padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--page); color:var(--ink);
  font:14px/1.65 system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  min-height:100vh;
}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:none}
input,select,textarea{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:7px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky; top:0; z-index:50; background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 20px;
}
.brand{font-weight:700; font-size:15px; white-space:nowrap; display:flex; align-items:center; gap:7px}
.brand .logo{font-size:18px}
#projectSelect{max-width:280px; min-width:150px; padding:6px 8px; font-size:13px}
.tabs{display:flex; gap:2px; overflow-x:auto; flex:1; min-width:200px}
.tab{
  padding:7px 13px; border-radius:8px; font-size:13.5px; color:var(--ink2);
  white-space:nowrap; border:1px solid transparent;
}
.tab:hover{background:var(--chip-bg)}
.tab.active{background:var(--chip-bg); color:var(--ink); font-weight:600}
.iconbtn{
  width:34px; height:34px; border-radius:8px; display:inline-flex; align-items:center;
  justify-content:center; font-size:16px; color:var(--ink2); border:1px solid transparent;
}
.iconbtn:hover{background:var(--chip-bg); color:var(--ink)}
.iconbtn:disabled{opacity:.4; cursor:default}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning{animation:spin 1s linear infinite}

/* ============ 布局与卡片 ============ */
main{max-width:1160px; margin:0 auto; padding:20px}
main.loading-dim{opacity:.45; pointer-events:none; transition:opacity .2s}
.banner{
  max-width:1160px; margin:14px auto 0; padding:0 20px;
}
.banner .inner{
  border:1px solid var(--border); background:var(--surface); border-radius:10px;
  padding:10px 14px; font-size:13px; color:var(--ink2); display:flex; gap:8px; align-items:baseline;
}
.banner .inner.warn{border-color:var(--serious)}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:18px 20px; margin-bottom:16px;
}
.card h3{font-size:15px; margin-bottom:4px}
.cardhead{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:10px}
.cardhead .spacer{flex:1}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
@media (max-width:860px){ .grid2,.grid3{grid-template-columns:1fr} }
.muted{color:var(--muted)} .ink2{color:var(--ink2)}
.small{font-size:12.5px}
.empty{
  text-align:center; padding:44px 20px; color:var(--ink2); font-size:13.5px;
}
.empty .big{font-size:30px; margin-bottom:10px}
.empty code{font-size:12.5px}
code,pre{font-family:ui-monospace,Consolas,"Cascadia Mono",monospace}
code{background:var(--chip-bg); border-radius:5px; padding:1.5px 5px; font-size:.92em}
pre{
  background:var(--chip-bg); border:1px solid var(--border2); border-radius:10px;
  padding:13px 15px; overflow-x:auto; font-size:12.8px; line-height:1.55; margin:10px 0;
}
pre code{background:none; padding:0}

/* ============ 徽章与状态 ============ */
.chip{
  display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:999px;
  font-size:11.5px; font-weight:600; background:var(--chip-bg); color:var(--ink2);
  white-space:nowrap; line-height:1.7;
}
.chip.tone{color:var(--ink)}
.status-chip{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; white-space:nowrap}
.status-dot{width:8px; height:8px; border-radius:50%; flex:none}

/* ============ 统计块(stat tile) ============ */
.tiles{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px}
.tile{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:13px 18px; min-width:130px; flex:1;
}
.tile .lbl{font-size:12px; color:var(--ink2); margin-bottom:2px}
.tile .val{font-size:24px; font-weight:600; line-height:1.25}
.tile .delta{font-size:12px; font-weight:600; margin-left:7px}
.delta.up{color:var(--delta-good)} .delta.down{color:var(--crit)}
.metric-row{display:flex; gap:12px; flex-wrap:wrap; margin:10px 0 4px}
.metric{
  border:1px solid var(--border2); border-radius:10px; padding:8px 14px; min-width:110px;
  background:var(--page);
}
.metric .lbl{font-size:11.5px; color:var(--ink2)}
.metric .val{font-size:18px; font-weight:600}

/* ============ 提交时间线 ============ */
.filters{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:16px}
.filters input[type=search]{width:220px}
.fchip{
  padding:4px 11px; border-radius:999px; border:1px solid var(--border); font-size:12px;
  color:var(--ink2); background:var(--surface);
}
.fchip.on{background:var(--chip-bg); color:var(--ink); font-weight:600; border-color:var(--ink2)}
.daygroup{margin-bottom:6px}
.dayhead{
  font-size:12.5px; font-weight:700; color:var(--ink2); margin:14px 0 8px;
  display:flex; align-items:center; gap:10px;
}
.dayhead::after{content:""; flex:1; height:1px; background:var(--border2)}
.commit{
  display:flex; gap:12px; padding:9px 6px 9px 2px; border-radius:10px; position:relative;
}
.commit:hover{background:var(--chip-bg)}
.commit .rail{width:20px; flex:none; display:flex; flex-direction:column; align-items:center}
.commit .dot{width:9px; height:9px; border-radius:50%; background:var(--axis); margin-top:7px; flex:none}
.commit .line{width:1.5px; flex:1; background:var(--border2); margin-top:3px}
.commit:last-child .line{display:none}
.commit .body{flex:1; min-width:0}
.commit .title{font-size:13.8px; font-weight:550; word-break:break-word}
.commit .meta{font-size:12px; color:var(--muted); display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-top:2px}
.commit .meta img{width:16px; height:16px; border-radius:50%; vertical-align:-3px}
.commit .sha{font-family:ui-monospace,Consolas,monospace; font-size:11.5px}
.commit .msgbody{
  margin-top:7px; padding:9px 12px; background:var(--chip-bg); border-radius:8px;
  font-size:12.6px; color:var(--ink2); white-space:pre-wrap; word-break:break-word; display:none;
}
.commit.open .msgbody{display:block}
.expander{font-size:11px; color:var(--accent); padding:1px 6px; border-radius:5px}
.expander:hover{background:var(--chip-bg)}
.loadmore{display:block; margin:14px auto 0; padding:7px 22px; border:1px solid var(--border); border-radius:999px; color:var(--ink2); font-size:13px}
.loadmore:hover{background:var(--chip-bg)}

/* ============ 图表 ============ */
.chartwrap{margin-top:8px}
.legend{display:flex; gap:16px; flex-wrap:wrap; margin:2px 0 8px; font-size:12px; color:var(--ink2)}
.legend .li{display:inline-flex; align-items:center; gap:6px}
.lkey-line{width:18px; height:2.5px; border-radius:2px; flex:none}
.lkey-rect{width:10px; height:10px; border-radius:3px; flex:none}
svg.chart{display:block; width:100%; overflow:visible}
svg.chart text{font:11px system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; fill:var(--muted)}
svg.chart .ticklbl{font-variant-numeric:tabular-nums}
svg.chart .axlbl{fill:var(--ink2); font-size:11.5px}
svg.chart .dlabel{fill:var(--ink2); font-size:11px; font-weight:600}
svg.chart .gline{stroke:var(--grid); stroke-width:1}
svg.chart .baseline{stroke:var(--axis); stroke-width:1}
svg.chart .xhair{stroke:var(--axis); stroke-width:1; visibility:hidden}
svg.chart .bar{transition:filter .1s}
svg.chart .bar.lift, svg.chart .bar:hover{filter:brightness(1.12)}
svg.chart .hit{fill:transparent; stroke:none; outline:none}
svg.chart .hit:focus-visible{stroke:var(--accent); stroke-width:2; stroke-dasharray:none}
.tbl-toggle{font-size:12px; color:var(--accent); padding:2px 8px; border-radius:6px}
.tbl-toggle:hover{background:var(--chip-bg)}
.datatable{width:100%; border-collapse:collapse; margin-top:10px; font-size:12.5px}
.datatable th,.datatable td{border:1px solid var(--border2); padding:5px 10px; text-align:right; font-variant-numeric:tabular-nums}
.datatable th:first-child,.datatable td:first-child{text-align:left}
.datatable th{background:var(--chip-bg); color:var(--ink2); font-weight:600}

/* 悬浮提示 */
#tip{
  position:fixed; z-index:99; pointer-events:none; visibility:hidden;
  background:var(--surface); border:1px solid var(--border); border-radius:9px;
  padding:8px 11px; font-size:12px; box-shadow:0 4px 16px rgba(0,0,0,.13); max-width:280px;
}
#tip .t-title{font-weight:700; color:var(--ink2); margin-bottom:4px; font-size:11.5px}
#tip .t-row{display:flex; align-items:center; gap:7px; margin:2.5px 0}
#tip .t-key{width:12px; height:3px; border-radius:2px; flex:none}
#tip .t-val{font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums}
#tip .t-name{color:var(--ink2)}

/* ============ 结果卡片 ============ */
.result-summary{
  border-left:3px solid var(--accent); background:var(--chip-bg);
  padding:9px 13px; border-radius:0 9px 9px 0; font-size:13.5px; margin:8px 0 4px;
}
.result-notes{font-size:13px; color:var(--ink2); margin-top:10px; white-space:pre-wrap}
.result-imgs{display:flex; gap:12px; flex-wrap:wrap; margin-top:12px}
.result-imgs figure{max-width:420px; flex:1 1 300px}
.result-imgs img{max-width:100%; border-radius:9px; border:1px solid var(--border)}
.result-imgs figcaption{font-size:11.5px; color:var(--muted); margin-top:4px}

/* ============ Markdown 渲染(研究方法) ============ */
.methods-layout{display:grid; grid-template-columns:210px 1fr; gap:26px; align-items:start}
@media (max-width:860px){ .methods-layout{grid-template-columns:1fr} .toc{display:none} }
.toc{position:sticky; top:70px; font-size:12.5px; max-height:calc(100vh - 90px); overflow-y:auto}
.toc .toc-h{font-weight:700; color:var(--ink2); margin-bottom:8px; font-size:12px}
.toc a{display:block; color:var(--ink2); padding:3px 9px; border-left:2px solid var(--border2); line-height:1.5}
.toc a:hover{color:var(--ink); text-decoration:none; border-left-color:var(--axis)}
.toc a.l3{padding-left:21px; font-size:12px; color:var(--muted)}
.md{max-width:760px}
.md h1{font-size:24px; margin:4px 0 14px; line-height:1.35}
.md h2{
  font-size:17.5px; margin:30px 0 10px; padding-bottom:7px;
  border-bottom:1px solid var(--border2); scroll-margin-top:70px;
}
.md h3{font-size:15px; margin:20px 0 7px; scroll-margin-top:70px}
.md h4{font-size:13.5px; margin:15px 0 5px; color:var(--ink2)}
.md p{margin:8px 0}
.md ul,.md ol{margin:8px 0 8px 24px}
.md li{margin:3.5px 0}
.md li.task{list-style:none; margin-left:-20px}
.md li.task .cb{display:inline-block; width:15px; height:15px; border:1.5px solid var(--axis); border-radius:4px; vertical-align:-3px; margin-right:7px; text-align:center; line-height:13px; font-size:11px}
.md li.task.done .cb{background:var(--good); border-color:var(--good); color:#fff}
.md li.task.done{color:var(--muted)}
.md blockquote{
  border-left:3px solid var(--s4); background:var(--chip-bg); border-radius:0 9px 9px 0;
  padding:9px 14px; margin:10px 0; color:var(--ink2); font-size:13.4px;
}
.md blockquote p{margin:4px 0}
.md table{border-collapse:collapse; margin:12px 0; font-size:13px; max-width:100%; display:block; overflow-x:auto}
.md th,.md td{border:1px solid var(--border); padding:6px 12px; text-align:left}
.md th{background:var(--chip-bg); font-weight:600}
.md hr{border:none; border-top:1px solid var(--border2); margin:22px 0}
.md img{max-width:100%; border-radius:9px}
.md .lede{font-size:15px; color:var(--ink2)}

/* ============ 计划视图 ============ */
.exp-card{border:1px solid var(--border); border-radius:12px; padding:14px 17px; margin-bottom:12px; background:var(--surface)}
.exp-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.exp-head .name{font-weight:650; font-size:14.5px}
.exp-id{font-family:ui-monospace,Consolas,monospace; font-size:11.5px; background:var(--chip-bg); border-radius:6px; padding:1px 7px; color:var(--ink2)}
.exp-dates{font-size:12px; color:var(--muted); margin-left:auto; font-variant-numeric:tabular-nums}
.exp-fields{display:grid; grid-template-columns:1fr 1fr; gap:9px 18px; margin-top:10px}
@media (max-width:700px){ .exp-fields{grid-template-columns:1fr} }
.exp-field .flbl{font-size:11.5px; color:var(--muted); font-weight:600; margin-bottom:1px}
.exp-field .fval{font-size:13px; color:var(--ink2); white-space:pre-wrap}
.exp-field.wide{grid-column:1/-1}
.prio-high{color:var(--crit); font-size:11.5px; font-weight:700}
.gantt-row-lbl{font-size:12.5px; display:flex; align-items:center; gap:7px; height:34px; overflow:hidden; white-space:nowrap}
.gantt-row-lbl>span:last-child{overflow:hidden; text-overflow:ellipsis}
.gantt-wrap{display:grid; grid-template-columns:190px 1fr; gap:0}
@media (max-width:700px){ .gantt-wrap{grid-template-columns:120px 1fr} }
.milestones{display:flex; flex-direction:column; gap:7px; margin-top:6px}
.ms{display:flex; gap:10px; align-items:baseline; font-size:13px}
.ms .msdate{font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; width:88px; flex:none}
.ms.done{color:var(--muted); text-decoration:line-through}
.ms .msmark{flex:none; width:9px; height:9px; transform:rotate(45deg); background:var(--s7); border-radius:2px}
.ms.done .msmark{background:var(--good)}

/* ============ 概览 ============ */
.proj-card{cursor:pointer; transition:border-color .12s}
.proj-card:hover{border-color:var(--axis)}
.proj-title{font-size:15.5px; font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.proj-desc{color:var(--ink2); font-size:13px; margin:3px 0 10px}
.proj-stats{display:flex; gap:18px; flex-wrap:wrap; font-size:12.5px; color:var(--ink2); align-items:center}
.proj-stats b{font-size:15px; color:var(--ink)}
.latest-line{margin-top:10px; padding-top:10px; border-top:1px solid var(--border2); font-size:12.5px; color:var(--ink2)}
.latest-line .lb{color:var(--muted); font-weight:600; font-size:11.5px}

/* ============ 设置对话框 ============ */
dialog{
  border:1px solid var(--border); border-radius:14px; background:var(--surface); color:var(--ink);
  padding:0; max-width:560px; width:calc(100vw - 40px);
}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg-head{padding:16px 22px 0; font-size:16px; font-weight:700}
.dlg-body{padding:14px 22px 6px; max-height:70vh; overflow-y:auto}
.dlg-body label{display:block; font-size:12.5px; font-weight:650; color:var(--ink2); margin:13px 0 4px}
.dlg-body .hint{font-size:11.8px; color:var(--muted); margin-top:3px; line-height:1.5}
.dlg-body input[type=text],.dlg-body input[type=password],.dlg-body textarea{width:100%}
.dlg-body textarea{min-height:84px; font-family:ui-monospace,Consolas,monospace; font-size:12.5px}
.dlg-foot{padding:14px 22px 18px; display:flex; gap:10px; justify-content:flex-end; align-items:center}
.btn{padding:7px 18px; border-radius:9px; border:1px solid var(--border); font-size:13.5px; color:var(--ink2)}
.btn:hover{background:var(--chip-bg)}
.btn.primary{background:var(--accent); color:#fff; border-color:transparent; font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.repolist{margin-top:8px; max-height:180px; overflow-y:auto; border:1px solid var(--border2); border-radius:9px; padding:6px 10px; display:none}
.repolist label{display:flex; gap:8px; align-items:baseline; margin:4px 0; font-weight:400; font-size:13px; cursor:pointer}
.repolist .rdesc{color:var(--muted); font-size:11.5px}
.err-inline{color:var(--crit); font-size:12.5px; margin-top:6px}
footer{max-width:1160px; margin:10px auto 30px; padding:0 20px; color:var(--muted); font-size:11.8px}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo">🔬</span>科研记录</div>
  <select id="projectSelect" title="选择项目"></select>
  <nav class="tabs" id="tabs"></nav>
  <button class="iconbtn" id="btnRefresh" title="刷新数据">⟳</button>
  <button class="iconbtn" id="btnTheme" title="切换主题">🌙</button>
  <button class="iconbtn" id="btnSettings" title="设置">⚙</button>
</header>

<div class="banner" id="banner" hidden><div class="inner" id="bannerInner"></div></div>

<main id="view"></main>

<footer>科研记录平台 · 数据来自 GitHub API · 令牌与配置仅保存在本机浏览器 localStorage</footer>

<div id="tip"></div>

<dialog id="settingsDlg">
  <div class="dlg-head">设置</div>
  <div class="dlg-body">
    <label for="setToken">GitHub 访问令牌(可选)</label>
    <input type="password" id="setToken" placeholder="ghp_... 或 github_pat_..." autocomplete="off">
    <div class="hint">公开仓库可不填(限每小时 60 次请求)。访问私有仓库或提高限额,请在
      GitHub → Settings → Developer settings → Fine-grained tokens 创建只读令牌(仓库权限勾选 Contents: Read)。令牌仅保存在本机浏览器。</div>

    <label for="setRepos">关联的科研项目仓库</label>
    <textarea id="setRepos" placeholder="每行一个,格式: owner/repo 或 owner/repo#分支&#10;例如: f34huang/gnn-molprop"></textarea>

    <label for="setUser">或从 GitHub 账户加载仓库列表</label>
    <div style="display:flex; gap:8px">
      <input type="text" id="setUser" placeholder="GitHub 用户名" style="flex:1">
      <button class="btn" id="btnLoadRepos">加载</button>
    </div>
    <div class="repolist" id="repoList"></div>
    <div class="err-inline" id="setErr" hidden></div>
  </div>
  <div class="dlg-foot">
    <button class="btn" id="btnClearAll" style="margin-right:auto">清除全部配置</button>
    <button class="btn" id="btnCancel">取消</button>
    <button class="btn primary" id="btnSave">保存</button>
  </div>
</dialog>

<script>

/* =================================================================

/* ---------------- 工具 ---------------- */
const $=s=>document.querySelector(s);
function el(tag, cls, text){
  const n=document.createElement(tag);
  if(cls) n.className=cls;
  if(text!=null) n.textContent=text;
  return n;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtNum(v){
  if(v==null||isNaN(v)) return '—';
  const a=Math.abs(v);
  if(a>=10000) return v.toLocaleString('zh-CN',{maximumFractionDigits:0});
  if(a>=1000) return v.toLocaleString('zh-CN',{maximumFractionDigits:1});
  if(Number.isInteger(v)) return String(v);
  if(a>=1) return v.toFixed(Math.abs(v)>=100?1:2).replace(/\.?0+$/,'');
  return v.toPrecision(3).replace(/\.?0+$/,'');
}
function parseDate(s){ if(!s) return null; const d=new Date(/^\d{4}-\d{2}-\d{2}$/.test(s)? s+'T00:00:00' : s); return isNaN(d)?null:d; }
function fmtDate(d, withYear){
  if(typeof d==='string') d=parseDate(d);
  if(!d) return '—';
  const y=d.getFullYear(), now=new Date();
  const base=`${d.getMonth()+1}月${d.getDate()}日`;
  return (withYear||y!==now.getFullYear())? `${y}年${base}` : base;
}
function isoDay(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function relTime(iso){
  const d=parseDate(iso); if(!d) return '';
  const s=(Date.now()-d.getTime())/1000;
  if(s<60) return '刚刚';
  if(s<3600) return Math.floor(s/60)+' 分钟前';
  if(s<86400) return Math.floor(s/3600)+' 小时前';
  if(s<86400*30) return Math.floor(s/86400)+' 天前';
  return fmtDate(d,true);
}
function dayLabel(dateStr){
  const d=parseDate(dateStr), today=new Date();
  const t0=isoDay(today);
  const y=new Date(today); y.setDate(y.getDate()-1);
  if(dateStr===t0) return '今天';
  if(dateStr===isoDay(y)) return '昨天';
  const wd='日一二三四五六'[d.getDay()];
  return `${fmtDate(d)} 周${wd}`;
}
function debounce(fn,ms){ let t; return (...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a),ms)}; }

const TYPE_ALIASES={results:'result', doc:'docs', experiment:'exp', figure:'fig', figs:'fig'};
function parseCommitType(msg){
  const first=msg.split('\n')[0];
  if(/^merge\b/i.test(first)) return {type:'merge', title:first};
  /* 支持 type: 与 type(scope): 两种格式;未知词表 → '#'+原词,渲染为中性徽章 */
  const m=first.match(/^(\w+)(?:\(([^)]*)\))?\s*[:：]\s*(.*)$/);
  if(!m) return {type:null, title:first};
  const t=TYPE_ALIASES[m[1].toLowerCase()]||m[1].toLowerCase();
  const title=(m[2]? '['+m[2]+'] ':'')+m[3];
  return COMMIT_TYPES[t]? {type:t, title} : {type:'#'+t, title};
}

/* ---------------- GitHub API ---------------- */
const API='https://api.github.com';
function ghErr(kind, extra){ const e=new Error(kind); e.kind=kind; Object.assign(e, extra||{}); return e; }
async function gh(path, opt){
  opt=opt||{};
  const h={'X-GitHub-Api-Version':'2022-11-28',
           'Accept': opt.raw? 'application/vnd.github.raw+json':'application/vnd.github+json'};
  if(config.token) h['Authorization']='Bearer '+config.token.trim();
  let res;
  try{ res=await fetch(API+path,{headers:h}); }
  catch(e){ throw ghErr('network'); }
  if(res.status===404) throw ghErr('notfound');
  if(res.status===401) throw ghErr('auth');
  if(res.status===403||res.status===429){
    if(res.headers.get('x-ratelimit-remaining')==='0')
      throw ghErr('ratelimit',{reset:+res.headers.get('x-ratelimit-reset')*1000});
    throw ghErr('forbidden');
  }
  if(!res.ok) throw ghErr('http',{status:res.status});
  return opt.blob? res.blob() : opt.raw? res.text() : res.json();
}
function errText(e){
  switch(e&&e.kind){
    case 'notfound': return '未找到(404)——仓库不存在,或是私有仓库需要在设置中填写令牌';
    case 'auth': return '令牌无效或已过期(401)';
    case 'ratelimit': return `GitHub API 请求次数已用完,${e.reset?('将于 '+new Date(e.reset).toLocaleTimeString('zh-CN')+' 重置,'):''}可在设置中填写令牌提高限额`;
    case 'forbidden': return '无权限访问(403)';
    case 'network': return '网络请求失败,请检查网络连接';
    default: return '请求失败'+(e&&e.status?(' (HTTP '+e.status+')'):'');
  }
}

function pkey(p){ return p.repo? p.owner+'/'+p.repo : p.owner; }
function parseRepoLine(line){
  line=line.trim(); if(!line) return null;
  const m=line.match(/^([\w.-]+)\/([\w.-]+?)(?:#(.+))?$/);
  if(!m) return null;
  return {owner:m[1], repo:m[2], branch:m[3]||''};
}

async function loadProject(p, force){
  const key=pkey(p);
  if(key===DEMO_KEY){ state.cache[key]=demoBundle(); return state.cache[key]; }
  if(!force && state.cache[key] && state.cache[key].loaded) return state.cache[key];
  const c=state.cache[key]={loaded:false, errors:{}, commits:[], commitPage:1, commitsDone:false};
  try{ c.meta=await gh('/repos/'+key); }
  catch(e){ c.errors.meta=e; c.loaded=true; return c; }
  c.branch=p.branch||c.meta.default_branch;
  const ref=encodeURIComponent(c.branch);
  const jobs=[
    gh(`/repos/${key}/commits?sha=${ref}&per_page=60`).then(r=>{c.commits=r; c.commitsDone=r.length<60;}).catch(e=>{c.errors.commits=e;}),
    gh(`/repos/${key}/contents/CLAUDE.md?ref=${ref}`,{raw:true}).then(t=>{c.claudemd=t;}).catch(e=>{ if(e.kind!=='notfound') c.errors.claudemd=e; }),
    gh(`/repos/${key}/contents/research/results.json?ref=${ref}`,{raw:true}).then(t=>{
      try{ c.results=JSON.parse(t); }catch(pe){ c.errors.results=ghErr('parse'); c.parseMsgResults=pe.message; }
    }).catch(e=>{ if(e.kind!=='notfound') c.errors.results=e; }),
    gh(`/repos/${key}/contents/research/plan.json?ref=${ref}`,{raw:true}).then(t=>{
      try{ c.plan=JSON.parse(t); }catch(pe){ c.errors.plan=ghErr('parse'); c.parseMsgPlan=pe.message; }
    }).catch(e=>{ if(e.kind!=='notfound') c.errors.plan=e; }),
  ];
  await Promise.all(jobs);
  c.loaded=true;
  return c;
}
async function loadMoreCommits(p){
  const c=state.cache[pkey(p)]; if(!c||c.commitsDone) return;
  c.commitPage++;
  try{
    const more=await gh(`/repos/${pkey(p)}/commits?sha=${encodeURIComponent(c.branch)}&per_page=60&page=${c.commitPage}`);
    c.commits=c.commits.concat(more);
    if(more.length<60) c.commitsDone=true;
  }catch(e){ c.commitsDone=true; }
}
/* 仓库内图片 → blob URL(公有/私有仓库均可) */
const imgCache={};
async function repoImageURL(key, branch, path){
  const ck=key+'@'+branch+':'+path;
  if(imgCache[ck]) return imgCache[ck];
  const blob=await gh(`/repos/${key}/contents/${path.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(branch)}`,{raw:true, blob:true});
  imgCache[ck]=URL.createObjectURL(blob);
  return imgCache[ck];
}

function slugify(t, used){
  let s=t.toLowerCase().trim().replace(/[^\w一-鿿]+/g,'-').replace(/^-+|-+$/g,'')||'sec';
  let base=s, i=2;
  while(used.has(s)) s=base+'-'+(i++);
  used.add(s);
  return s;
}
function safeUrl(u, img){
  /* 仅允许 http(s)/mailto/锚点/相对路径;图片额外允许 data:image */
  if(/^[a-z][\w+.-]*:/i.test(u) && !/^(https?:|mailto:)/i.test(u) && !(img&&/^data:image\//i.test(u))) return null;
  return u;
}
function mdInline(s){
  /* s 已经过 esc()。行内代码优先保护 */
  const codes=[];
  s=s.replace(/`([^`]+)`/g,(m,c)=>{ codes.push(c); return '\u0000'+(codes.length-1)+'\u0000'; });
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(m,alt,src)=>{
    const u=safeUrl(src,true);
    return u? `<img src="${u}" alt="${alt}" loading="lazy" data-mdimg="1">` : m;
  });
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,txt,href)=>{
    const u=safeUrl(href);
    return u? `<a href="${u}" target="_blank" rel="noopener">${txt}</a>` : txt;
  });
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[\s(（>])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>');
  s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>'<code>'+codes[+i]+'</code>');
  return s;
}
function mdRender(src){
  const lines=src.replace(/\r\n?/g,'\n').split('\n');
  const out=[], toc=[], used=new Set();
  let i=0, firstH1=false;
  function flushPara(buf){ if(buf.length){ out.push('<p>'+mdInline(esc(buf.join(' ')))+'</p>'); buf.length=0; } }
  const para=[];
  while(i<lines.length){
    const ln=lines[i];
    /* 代码块 */
    let m=ln.match(/^```(\w*)\s*$/);
    if(m){
      flushPara(para);
      const buf=[]; i++;
      while(i<lines.length && !/^```\s*$/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');
      continue;
    }
    /* 标题 */
    m=ln.match(/^(#{1,6})\s+(.*)$/);
    if(m){
      flushPara(para);
      const lv=m[1].length, txt=m[2].trim();
      const id=slugify(txt, used);
      if(lv>=2&&lv<=3) toc.push({lv, txt, id});
      out.push(`<h${lv} id="${id}">${mdInline(esc(txt))}</h${lv}>`);
      if(lv===1&&!firstH1){
        firstH1=true;
        /* 首个 H1 后若紧跟引用块,作为导语 */
        let j=i+1; while(j<lines.length&&!lines[j].trim()) j++;
        if(j<lines.length&&/^>\s?/.test(lines[j])){
          const q=[];
          while(j<lines.length&&/^>\s?/.test(lines[j])){ q.push(lines[j].replace(/^>\s?/,'')); j++; }
          out.push('<p class="lede">'+mdInline(esc(q.join(' ')))+'</p>');
          i=j; continue;
        }
      }
      i++; continue;
    }
    /* 分隔线 */
    if(/^\s*([-*_])\s*(\1\s*){2,}$/.test(ln)){ flushPara(para); out.push('<hr>'); i++; continue; }
    /* 引用块 */
    if(/^>\s?/.test(ln)){
      flushPara(para);
      const q=[];
      while(i<lines.length&&/^>\s?/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/,'')); i++; }
      out.push('<blockquote>'+q.map(x=>x.trim()?('<p>'+mdInline(esc(x))+'</p>'):'').join('')+'</blockquote>');
      continue;
    }
    /* 表格 */
    if(/^\s*\|.*\|\s*$/.test(ln) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      flushPara(para);
      const parseRow=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=parseRow(ln); i+=2;
      const rows=[];
      while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){ rows.push(parseRow(lines[i])); i++; }
      let t='<table><thead><tr>'+head.map(h=>'<th>'+mdInline(esc(h))+'</th>').join('')+'</tr></thead><tbody>';
      for(const r of rows) t+='<tr>'+head.map((_,ci)=>'<td>'+mdInline(esc(r[ci]||''))+'</td>').join('')+'</tr>';
      out.push(t+'</tbody></table>');
      continue;
    }
    /* 列表(支持一层缩进嵌套与任务项) */
    if(/^\s*([-*+]|\d+[.)])\s+/.test(ln)){
      flushPara(para);
      const items=[];
      while(i<lines.length&&/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])){
        const im=lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        items.push({indent:im[1].length, ordered:/\d/.test(im[2]), text:im[3]});
        i++;
        /* 悬挂续行 */
        while(i<lines.length&&/^\s{2,}\S/.test(lines[i])&&!/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])){
          items[items.length-1].text+=' '+lines[i].trim(); i++;
        }
      }
      function buildList(arr){
        if(!arr.length) return '';
        const base=arr[0].indent, tag=arr[0].ordered?'ol':'ul';
        let h='<'+tag+'>', k=0;
        while(k<arr.length){
          const it=arr[k];
          const sub=[]; let j=k+1;
          while(j<arr.length&&arr[j].indent>base){ sub.push(arr[j]); j++; }
          const tm=it.text.match(/^\[([ xX])\]\s+(.*)$/);
          if(tm){
            const done=tm[1]!==' ';
            h+=`<li class="task${done?' done':''}"><span class="cb">${done?'✓':''}</span>${mdInline(esc(tm[2]))}${buildList(sub)}</li>`;
          }else{
            h+='<li>'+mdInline(esc(it.text))+buildList(sub)+'</li>';
          }
          k=j;
        }
        return h+'</'+tag+'>';
      }
      out.push(buildList(items));
      continue;
    }
    /* 空行 / 段落 */
    if(!ln.trim()){ flushPara(para); i++; continue; }
    para.push(ln.trim()); i++;
  }
  flushPara(para);
  return {html:out.join('\n'), toc};
}

/* ---------------- 悬浮提示 ---------------- */
const tip=$('#tip');
function tipShow(x,y,build){
  tip.textContent='';
  build(tip);
  tip.style.visibility='visible';
  const r=tip.getBoundingClientRect();
  let px=x+14, py=y+14;
  if(px+r.width>innerWidth-8) px=x-r.width-12;
  if(py+r.height>innerHeight-8) py=y-r.height-12;
  tip.style.left=px+'px'; tip.style.top=py+'px';
}
function tipHide(){ tip.style.visibility='hidden'; }
function tipTitle(t){ const d=el('div','t-title',t); return d; }
function tipRow(color,value,name,keyShape){
  const r=el('div','t-row');
  const k=el('span','t-key'); k.style.background=color;
  if(keyShape==='rect'){ k.style.height='9px'; k.style.width='9px'; k.style.borderRadius='2.5px'; }
  r.append(k, el('span','t-val',value), el('span','t-name',name||''));
  return r;
}

/* ---------------- 图表渲染 ---------------- */
const SERIES_VARS=['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
const NS='http://www.w3.org/2000/svg';
function svgEl(tag, attrs){
  const n=document.createElementNS(NS,tag);
  for(const k in attrs||{}) n.setAttribute(k,attrs[k]);
  return n;
}
function niceNum(x, round){
  if(x<=0) return 1;
  const e=Math.floor(Math.log10(x)), f=x/Math.pow(10,e);
  let nf;
  if(round) nf=f<1.5?1:f<3?2:f<7?5:10;
  else nf=f<=1?1:f<=2?2:f<=5?5:10;
  return nf*Math.pow(10,e);
}
function ticksFor(min,max,count){
  count=count||5;
  if(min===max){ min-=Math.abs(min)*.1||1; max+=Math.abs(max)*.1||1; }
  const range=niceNum(max-min,false), step=niceNum(range/(count-1),true);
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step;
  const t=[];
  for(let v=lo; v<=hi+step/2; v+=step) t.push(+v.toFixed(10));
  return {lo,hi,step,ticks:t};
}

/* 注册图表以便窗口尺寸变化时重建 */
function registerChart(host, build){
  state.chartRegistry.push({host, build});
  requestAnimationFrame(build); /* 等待布局完成再取容器宽度 */
}
addEventListener('resize', debounce(()=>{
  for(const c of state.chartRegistry) if(document.contains(c.host)) c.build();
},200));

function chartCard(spec, opts){
  /* 返回 {node, build};spec: {type,xLabel,yLabel,series,diag} */
  opts=opts||{};
  const wrap=el('div','chartwrap');
  let series=(spec.series||[]).filter(s=>Array.isArray(s.data)&&s.data.length);
  let capNote='';
  if(spec.type==='scatter'&&series.length>3){ capNote=`(散点图最多显示 3 个系列,已省略 ${series.length-3} 个)`; series=series.slice(0,3); }
  else if(series.length>8){ capNote=`(最多显示 8 个系列,已省略 ${series.length-8} 个)`; series=series.slice(0,8); }
  if(!series.length){ wrap.append(el('div','muted small','(无图表数据)')); return wrap; }

  /* 图例(≥2 个系列时必有) */
  if(series.length>=2){
    const lg=el('div','legend');
    series.forEach((s,si)=>{
      const li=el('span','li');
      const key=el('span', spec.type==='line'?'lkey-line':'lkey-rect');
      key.style.background=`var(${SERIES_VARS[si]})`;
      li.append(key, document.createTextNode(s.name||('系列 '+(si+1))));
      lg.append(li);
    });
    if(capNote) lg.append(el('span','muted small',capNote));
    wrap.append(lg);
  }
  const svgHost=el('div');
  wrap.append(svgHost);

  /* 数据表视图(始终可用) */
  const tblBox=el('div'); tblBox.hidden=true;
  wrap.append(tblBox);
  buildDataTable(tblBox, spec, series);

  function build(){ drawChart(svgHost, spec, series); }
  registerChart(svgHost, build);
  wrap._toggleTable=()=>{ tblBox.hidden=!tblBox.hidden; return !tblBox.hidden; };
  return wrap;
}
function buildDataTable(box, spec, series){
  const cats=collectX(series);
  const t=el('table','datatable');
  const thr=el('tr');
  thr.append(el('th',null,spec.xLabel||'X'));
  series.forEach(s=>thr.append(el('th',null,s.name||'值')));
  const thead=el('thead'); thead.append(thr); t.append(thead);
  const tb=el('tbody');
  cats.forEach(x=>{
    const tr=el('tr');
    tr.append(el('td',null,String(x)));
    series.forEach(s=>{
      const p=s.data.find(d=>String(d[0])===String(x));
      tr.append(el('td',null,p?fmtNum(+p[1]):'—'));
    });
    tb.append(tr);
  });
  t.append(tb); box.append(t);
}
function collectX(series){
  const seen=new Set(), xs=[];
  for(const s of series) for(const d of s.data){
    const k=String(d[0]);
    if(!seen.has(k)){ seen.add(k); xs.push(d[0]); }
  }
  if(xs.every(x=>typeof x==='number'||(!isNaN(parseFloat(x))&&isFinite(x)))) xs.sort((a,b)=>+a-+b);
  return xs;
}

function drawChart(host, spec, series){
  host.textContent='';
  const W=Math.max(300, host.clientWidth||620), H=270;
  const numericX = spec.type!=='bar' && series.every(s=>s.data.every(d=>typeof d[0]==='number'||(!isNaN(parseFloat(d[0]))&&isFinite(d[0]))));
  const pad={t:14, r:spec.type==='line'?58:18, b:spec.xLabel?46:30, l:56};
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const svg=svgEl('svg',{class:'chart', width:W, height:H, viewBox:`0 0 ${W} ${H}`, role:'img'});
  svg.setAttribute('aria-label', (spec.yLabel||'')+' 图表');

  /* Y 值域 */
  let ymin=Infinity, ymax=-Infinity;
  series.forEach(s=>s.data.forEach(d=>{ const v=+d[1]; if(v<ymin)ymin=v; if(v>ymax)ymax=v; }));
  if(spec.type==='bar'){ ymin=Math.min(0,ymin); ymax=Math.max(0,ymax); }
  const yt=ticksFor(ymin,ymax,5);
  const yPos=v=> pad.t + ih - (v-yt.lo)/(yt.hi-yt.lo)*ih;

  /* X 定位 */
  const cats=collectX(series);
  let xPos, bandW=0, xOfIndex;
  if(numericX && spec.type!=='bar'){
    const xs=cats.map(Number);
    let xmin=Math.min.apply(null,xs), xmax=Math.max.apply(null,xs);
    if(xmin===xmax){ xmin-=1; xmax+=1; }
    xPos=v=> pad.l + (v-xmin)/(xmax-xmin)*iw;
    xOfIndex=i=>xPos(+cats[i]);
    /* X 刻度 */
    const xtk=ticksFor(xmin,xmax,Math.min(7,Math.max(3,Math.floor(iw/80))));
    for(const tv of xtk.ticks){
      if(tv<xmin-1e-9||tv>xmax+1e-9) continue;
      const tx=svgEl('text',{x:xPos(tv), y:H-pad.b+16, 'text-anchor':'middle', class:'ticklbl'});
      tx.textContent=fmtNum(tv); svg.append(tx);
    }
  }else{
    bandW=iw/cats.length;
    xPos=null;
    xOfIndex=i=> pad.l + bandW*i + bandW/2;
    const every=Math.ceil(cats.length/Math.max(2,Math.floor(iw/70)));
    /* 可容纳字符数按实际带宽估算(每字约 6.5px),而非固定裁剪 */
    const maxCh=Math.max(6, Math.floor(bandW*every/6.5));
    cats.forEach((c,ci)=>{
      if(ci%every!==0&&ci!==cats.length-1) return;
      const tx=svgEl('text',{x:xOfIndex(ci), y:H-pad.b+16, 'text-anchor':'middle', class:'ticklbl'});
      const s=String(c);
      tx.textContent=s.length>maxCh? s.slice(0,maxCh-1)+'…' : s;
      if(s.length>maxCh){ const t=svgEl('title'); t.textContent=s; tx.append(t); }
      svg.append(tx);
    });
  }

  /* 网格线(横向,细,实线)与 Y 刻度 */
  for(const tv of yt.ticks){
    const y=yPos(tv);
    svg.append(svgEl('line',{x1:pad.l, x2:W-pad.r, y1:y, y2:y, class:'gline'}));
    const tx=svgEl('text',{x:pad.l-8, y:y+3.5, 'text-anchor':'end', class:'ticklbl'});
    tx.textContent=fmtNum(tv); svg.append(tx);
  }
  /* 基线 */
  const baseY=yPos(spec.type==='bar'?0:yt.lo);
  svg.append(svgEl('line',{x1:pad.l, x2:W-pad.r, y1:baseY, y2:baseY, class:'baseline'}));

  /* 轴标题 */
  if(spec.xLabel){
    const tx=svgEl('text',{x:pad.l+iw/2, y:H-6, 'text-anchor':'middle', class:'axlbl'});
    tx.textContent=spec.xLabel; svg.append(tx);
  }
  if(spec.yLabel){
    const tx=svgEl('text',{x:12, y:pad.t+ih/2, 'text-anchor':'middle', class:'axlbl',
      transform:`rotate(-90 12 ${pad.t+ih/2})`});
    tx.textContent=spec.yLabel; svg.append(tx);
  }

  /* y=x 参考线(散点图可选) */
  if(spec.type==='scatter'&&spec.diag&&numericX){
    const lo=Math.max(yt.lo, +cats[0]), hi=Math.min(yt.hi, +cats[cats.length-1]);
    if(hi>lo){
      svg.append(svgEl('line',{x1:xPos(lo), y1:yPos(lo), x2:xPos(hi), y2:yPos(hi),
        stroke:'var(--axis)', 'stroke-width':1}));
    }
  }

  const surface='var(--surface)';
  if(spec.type==='bar'){
    /* 分组柱状:柱宽 ≤24px,柱间 2px 表面缝,顶部 4px 圆角、底部方角 */
    const n=series.length;
    const gap=2;
    const barW=Math.min(24, Math.max(6,(bandW*0.72-gap*(n-1))/n));
    const groupW=barW*n+gap*(n-1);
    cats.forEach((c,ci)=>{
      const gx=xOfIndex(ci)-groupW/2;
      series.forEach((s,si)=>{
        const p=s.data.find(d=>String(d[0])===String(c));
        if(!p) return;
        const v=+p[1];
        const x=gx+si*(barW+gap);
        const y0=yPos(0), y1=yPos(v);
        const top=Math.min(y0,y1), h=Math.abs(y0-y1);
        const r=Math.min(4, h/2, barW/2);
        const up=v>=0;
        let dPath;
        if(up) dPath=`M${x},${y0} L${x},${top+r} Q${x},${top} ${x+r},${top} L${x+barW-r},${top} Q${x+barW},${top} ${x+barW},${top+r} L${x+barW},${y0} Z`;
        else dPath=`M${x},${y0} L${x},${top+h-r} Q${x},${top+h} ${x+r},${top+h} L${x+barW-r},${top+h} Q${x+barW},${top+h} ${x+barW},${top+h-r} L${x+barW},${y0} Z`;
        const path=svgEl('path',{d:dPath, class:'bar', 'data-cat':ci});
        path.style.fill=`var(${SERIES_VARS[si]})`;
        svg.append(path);
        /* 单系列且类目不多 → 柱顶数值标注 */
        if(n===1&&cats.length<=12){
          const tl=svgEl('text',{x:x+barW/2, y:(up?top:top+h)+(up?-6:14), 'text-anchor':'middle', class:'dlabel'});
          tl.textContent=fmtNum(v); svg.append(tl);
        }
      });
      /* 类目整列命中区:悬停显示该类目全部系列 */
      const hit=svgEl('rect',{x:pad.l+bandW*ci, y:pad.t, width:bandW, height:ih, class:'hit', tabindex:0});
      hit.setAttribute('aria-label', String(c));
      const show=(cx,cy)=>{
        svg.querySelectorAll('.bar').forEach(b=>b.classList.toggle('lift', +b.dataset.cat===ci));
        tipShow(cx,cy,box=>{
          box.append(tipTitle(String(c)));
          series.forEach((s,si)=>{
            const p=s.data.find(d=>String(d[0])===String(c));
            if(p) box.append(tipRow(getComputedStyle(document.documentElement).getPropertyValue(SERIES_VARS[si]), fmtNum(+p[1]), s.name||'', 'rect'));
          });
        });
      };
      hit.addEventListener('pointermove',e=>show(e.clientX,e.clientY));
      hit.addEventListener('pointerleave',()=>{ svg.querySelectorAll('.bar.lift').forEach(b=>b.classList.remove('lift')); tipHide(); });
      hit.addEventListener('focus',()=>{ const r=hit.getBoundingClientRect(); show(r.left+r.width/2, r.top+40); });
      hit.addEventListener('blur',()=>{ svg.querySelectorAll('.bar.lift').forEach(b=>b.classList.remove('lift')); tipHide(); });
      svg.append(hit);
    });
  }
  else if(spec.type==='scatter'){
    series.forEach((s,si)=>{
      s.data.forEach(d=>{
        const cx=numericX?xPos(+d[0]):xOfIndex(cats.findIndex(c=>String(c)===String(d[0])));
        const cy=yPos(+d[1]);
        const ring=svgEl('circle',{cx, cy, r:6.5, fill:surface});
        const dot=svgEl('circle',{cx, cy, r:4.5});
        dot.style.fill=`var(${SERIES_VARS[si]})`;
        svg.append(ring,dot);
        /* ≥24px 透明命中区 */
        const hit=svgEl('circle',{cx, cy, r:13, class:'hit', tabindex:0});
        hit.setAttribute('aria-label',`${s.name||''} (${fmtNum(+d[0])}, ${fmtNum(+d[1])})`);
        const show=(px,py)=>tipShow(px,py,box=>{
          box.append(tipTitle(s.name||''));
          box.append(tipRow(getComputedStyle(document.documentElement).getPropertyValue(SERIES_VARS[si]),
            `${fmtNum(+d[0])} , ${fmtNum(+d[1])}`,'','rect'));
        });
        hit.addEventListener('pointermove',e=>show(e.clientX,e.clientY));
        hit.addEventListener('pointerleave',tipHide);
        hit.addEventListener('focus',()=>{ const r=hit.getBoundingClientRect(); show(r.left+10,r.top); });
        hit.addEventListener('blur',tipHide);
        svg.append(hit);
      });
    });
  }
  else{ /* line */
    const endLabels=[];
    series.forEach((s,si)=>{
      const pts=s.data.map(d=>({x:numericX?xPos(+d[0]):xOfIndex(cats.findIndex(c=>String(c)===String(d[0]))), y:yPos(+d[1]), v:+d[1]}));
      const dPath=pts.map((p,pi)=>(pi?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
      const path=svgEl('path',{d:dPath, fill:'none', 'stroke-width':2, 'stroke-linecap':'round', 'stroke-linejoin':'round'});
      path.style.stroke=`var(${SERIES_VARS[si]})`;
      svg.append(path);
      const drawMk=pts.length<=42;
      pts.forEach((p,pi)=>{
        if(!drawMk&&pi!==pts.length-1) return;
        const ring=svgEl('circle',{cx:p.x, cy:p.y, r:6, fill:surface});
        const dot=svgEl('circle',{cx:p.x, cy:p.y, r:4});
        dot.style.fill=`var(${SERIES_VARS[si]})`;
        svg.append(ring,dot);
      });
      const last=pts[pts.length-1];
      endLabels.push({y:last.y, x:last.x, v:last.v, si});
    });
    /* 端点数值直标(≤4 系列且互不碰撞时) */
    if(series.length<=4){
      const sorted=endLabels.slice().sort((a,b)=>a.y-b.y);
      let collide=false;
      for(let k=1;k<sorted.length;k++) if(sorted[k].y-sorted[k-1].y<14) collide=true;
      if(!collide) endLabels.forEach(L=>{
        const tl=svgEl('text',{x:L.x+10, y:L.y+3.5, class:'dlabel'});
        tl.textContent=fmtNum(L.v); svg.append(tl);
      });
    }
    /* 十字线 + 全系列悬浮读数 */
    const xh=svgEl('line',{y1:pad.t, y2:pad.t+ih, class:'xhair'});
    svg.append(xh);
    const overlay=svgEl('rect',{x:pad.l, y:pad.t, width:iw, height:ih, class:'hit', tabindex:0});
    overlay.setAttribute('aria-label','折线图,方向键浏览数据点');
    let ai=-1;
    function showAt(idx, cx, cy){
      ai=idx;
      const x=xOfIndex(idx);
      xh.setAttribute('x1',x); xh.setAttribute('x2',x);
      xh.style.visibility='visible';
      tipShow(cx!=null?cx:svg.getBoundingClientRect().left+x, cy!=null?cy:svg.getBoundingClientRect().top+pad.t+30, box=>{
        box.append(tipTitle((spec.xLabel?spec.xLabel+' ':'')+String(cats[idx])));
        series.forEach((s,si)=>{
          const p=s.data.find(d=>String(d[0])===String(cats[idx]));
          if(p) box.append(tipRow(getComputedStyle(document.documentElement).getPropertyValue(SERIES_VARS[si]), fmtNum(+p[1]), s.name||''));
        });
      });
    }
    function hideHover(){ xh.style.visibility='hidden'; tipHide(); ai=-1; }
    overlay.addEventListener('pointermove',e=>{
      const rect=svg.getBoundingClientRect();
      const mx=e.clientX-rect.left;
      let best=0, bd=Infinity;
      cats.forEach((c,ci)=>{ const d=Math.abs(xOfIndex(ci)-mx); if(d<bd){bd=d; best=ci;} });
      showAt(best, e.clientX, e.clientY);
    });
    overlay.addEventListener('pointerleave',hideHover);
    overlay.addEventListener('keydown',e=>{
      if(e.key==='ArrowRight'){ showAt(Math.min(cats.length-1,(ai<0?0:ai+1))); e.preventDefault(); }
      else if(e.key==='ArrowLeft'){ showAt(Math.max(0,(ai<0?cats.length-1:ai-1))); e.preventDefault(); }
      else if(e.key==='Escape') hideHover();
    });
    overlay.addEventListener('blur',hideHover);
    svg.append(overlay);
  }
  host.append(svg);
}

/* 迷你趋势线(周提交数) */
function sparkline(commits, weeks){
  weeks=weeks||12;
  const now=new Date(); now.setHours(0,0,0,0);
  const buckets=new Array(weeks).fill(0);
  for(const c of commits||[]){
    const d=parseDate(c.commit.author.date); if(!d) continue;
    const diff=Math.floor((now-d)/(86400000*7));
    if(diff>=0&&diff<weeks) buckets[weeks-1-diff]++;
  }
  const W=120, H=28, max=Math.max(1,Math.max.apply(null,buckets));
  const svg=svgEl('svg',{width:W, height:H, viewBox:`0 0 ${W} ${H}`, 'aria-hidden':'true'});
  const pts=buckets.map((v,i)=>({x:4+i*(W-8)/(weeks-1), y:H-4-(v/max)*(H-10)}));
  const path=svgEl('path',{d:pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' '),
    fill:'none', 'stroke-width':1.5, 'stroke-linecap':'round'});
  path.style.stroke='var(--muted)';
  svg.append(path);
  const last=pts[pts.length-1];
  const dot=svgEl('circle',{cx:last.x, cy:last.y, r:3});
  dot.style.fill='var(--accent)';
  svg.append(dot);
  return svg;
}

/* ---------------- 甘特图 ---------------- */
function renderGantt(host, experiments, milestones){
  host.textContent='';
  const exps=experiments.filter(e=>parseDate(e.start)&&parseDate(e.end));
  if(!exps.length){ host.append(el('div','muted small','(实验缺少 start/end 日期,无法绘制时间线)')); return; }
  const today=new Date(); today.setHours(0,0,0,0);
  let lo=today, hi=today;
  exps.forEach(e=>{ const s=parseDate(e.start), t=parseDate(e.end); if(s<lo)lo=s; if(t>hi)hi=t; });
  (milestones||[]).forEach(m=>{ const d=parseDate(m.date); if(d){ if(d<lo)lo=d; if(d>hi)hi=d; } });
  lo=new Date(lo); lo.setDate(lo.getDate()-3);
  hi=new Date(hi); hi.setDate(hi.getDate()+4);
  const span=(hi-lo)/86400000;

  const wrap=el('div','gantt-wrap');
  const lblCol=el('div');
  const chartCol=el('div');
  wrap.append(lblCol,chartCol);
  host.append(wrap);

  const W=Math.max(280, chartCol.clientWidth||host.clientWidth-200), rowH=34, headH=26, msH=(milestones&&milestones.length)?24:0;
  const H=headH+msH+exps.length*rowH+6;
  const X=d=> (d-lo)/(hi-lo)*(W-8)+4;

  /* 左侧行标签 */
  lblCol.append(el('div',null,'')); lblCol.firstChild.style.height=(headH+msH)+'px';
  exps.forEach(e=>{
    const row=el('div','gantt-row-lbl');
    row.append(el('span','exp-id',e.id||''));
    row.append(el('span',null,e.name||''));
    row.title=e.name||'';
    lblCol.append(row);
  });

  const svg=svgEl('svg',{class:'chart', width:W, height:H, viewBox:`0 0 ${W} ${H}`});
  /* 时间刻度:跨度小用周,大用月 */
  const ticks=[];
  if(span<=70){
    const t=new Date(lo); t.setDate(t.getDate()+((8-t.getDay())%7)); /* 下一个周一 */
    while(t<=hi){ ticks.push(new Date(t)); t.setDate(t.getDate()+7); }
  }else{
    const t=new Date(lo.getFullYear(), lo.getMonth()+1, 1);
    while(t<=hi){ ticks.push(new Date(t)); t.setMonth(t.getMonth()+1); }
  }
  ticks.forEach(t=>{
    const x=X(t);
    svg.append(svgEl('line',{x1:x, x2:x, y1:headH, y2:H, class:'gline'}));
    const tx=svgEl('text',{x, y:12, 'text-anchor':'middle', class:'ticklbl'});
    tx.textContent=`${t.getMonth()+1}/${t.getDate()}`;
    svg.append(tx);
  });
  /* 里程碑菱形 */
  (milestones||[]).forEach(m=>{
    const d=parseDate(m.date); if(!d) return;
    const x=X(d), y=headH+msH/2;
    const dia=svgEl('rect',{x:x-4.5, y:y-4.5, width:9, height:9, rx:2, transform:`rotate(45 ${x} ${y})`, tabindex:0, class:'hit'});
    dia.style.fill=m.done?'var(--good)':'var(--s7)';
    dia.style.stroke='var(--surface)'; dia.style.strokeWidth='2';
    const show=(px,py)=>tipShow(px,py,box=>{
      box.append(tipTitle('里程碑 · '+fmtDate(d,true)));
      box.append(el('div',null,(m.done?'✓ ':'')+(m.label||'')));
    });
    dia.addEventListener('pointermove',e=>show(e.clientX,e.clientY));
    dia.addEventListener('pointerleave',tipHide);
    dia.addEventListener('focus',()=>{const r=dia.getBoundingClientRect(); show(r.left,r.top);});
    dia.addEventListener('blur',tipHide);
    svg.append(dia);
  });
  /* 实验条 */
  exps.forEach((e,ei)=>{
    const s=parseDate(e.start), t=parseDate(e.end);
    const y=headH+msH+ei*rowH+rowH/2;
    const st=STATUS_MAP[e.status]||STATUS_MAP.planned;
    const x1=X(s), x2=Math.max(X(t),x1+6);
    const bar=svgEl('rect',{x:x1, y:y-7, width:x2-x1, height:14, rx:4, tabindex:0, class:'hit'});
    bar.style.fill=st.color;
    if(e.status==='planned') bar.style.opacity='.45';
    const show=(px,py)=>tipShow(px,py,box=>{
      box.append(tipTitle((e.id?e.id+' · ':'')+(e.name||'')));
      box.append(el('div',null,`${st.icon} ${st.label} · ${e.start} → ${e.end}`));
    });
    bar.addEventListener('pointermove',ev=>show(ev.clientX,ev.clientY));
    bar.addEventListener('pointerleave',tipHide);
    bar.addEventListener('focus',()=>{const r=bar.getBoundingClientRect(); show(r.left+r.width/2,r.top);});
    bar.addEventListener('blur',tipHide);
    svg.append(bar);
  });
  /* 今天竖线 */
  if(today>=lo&&today<=hi){
    const x=X(today);
    svg.append(svgEl('line',{x1:x, x2:x, y1:headH-4, y2:H, stroke:'var(--ink2)', 'stroke-width':1}));
    const tx=svgEl('text',{x:x+4, y:headH+8, class:'axlbl'});
    tx.textContent='今天'; svg.append(tx);
  }
  chartCol.append(svg);
}

/* ---------------- 视图渲染 ---------------- */
const view=$('#view');
/* 从 ?repos=owner/repo,owner/repo#branch 读取项目并落盘到本机 localStorage。
   用于私有项目:清单只存在于链接与浏览器本地,不进入公开仓库。 */
function adoptProjectsFromURL(){
  let raw='';
  try{ raw=new URLSearchParams(location.search).get('repos')||''; }catch(e){ return; }
  if(!raw) return;
  let changed=false;
  raw.split(',').forEach(s=>{
    const p=parseRepoLine(s.trim());
    if(p && !config.projects.some(x=>pkey(x)===pkey(p))){ config.projects.push(p); changed=true; }
  });
  if(changed){ try{ localStorage.setItem(LS_CFG, JSON.stringify(config)); }catch(e){} }
}

let defaultProjects=null; /* 来自部署目录下的 projects.json(可选) */
async function loadDefaults(){
  if(defaultProjects!==null) return;
  defaultProjects=[];
  try{
    const r=await fetch('projects.json',{cache:'no-store'});
    if(r.ok){
      const j=await r.json();
      if(Array.isArray(j.projects))
        defaultProjects=j.projects.filter(p=>p&&p.owner&&p.repo)
          .map(p=>({owner:String(p.owner), repo:String(p.repo), branch:p.branch?String(p.branch):'', label:p.label?String(p.label):''}));
    }
  }catch(e){ /* file:// 或无此文件时静默降级 */ }
}
function currentProjects(){
  const list=[], seen=new Set();
  (defaultProjects||[]).concat(config.projects).forEach(p=>{
    const k=pkey(p);
    if(!seen.has(k)){ seen.add(k); list.push(p); }
  });
  list.push({owner:'__demo__', repo:'', label:'示例项目(演示)'});
  return list;
}
function currentP(){
  return currentProjects().find(p=>pkey(p)===state.project) || currentProjects()[0];
}
function cacheOf(){ return state.cache[state.project]; }

function setBanner(html, warn){
  const b=$('#banner'), inner=$('#bannerInner');
  if(!html){ b.hidden=true; return; }
  inner.className='inner'+(warn?' warn':'');
  inner.textContent='';
  if(typeof html==='string') inner.append(document.createTextNode(html));
  else inner.append(html);
  b.hidden=false;
}

function statusChip(status){
  const st=STATUS_MAP[status]||STATUS_MAP.planned;
  const c=el('span','status-chip');
  const dot=el('span','status-dot'); dot.style.background=st.color;
  c.append(dot, document.createTextNode(st.icon+' '+st.label));
  c.style.color=st.color;
  return c;
}
function typeChip(type){
  if(!type) return null;
  if(type[0]==='#') return el('span','chip', type.slice(1));
  const t=COMMIT_TYPES[type];
  if(!t) return null;
  const c=el('span','chip tone', t.icon+' '+t.label);
  c.style.background='color-mix(in srgb, '+t.color+' 13%, transparent)';
  return c;
}

function render(){
  state.chartRegistry=[];
  tipHide();
  view.textContent='';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===state.tab));
  const c=cacheOf();
  /* 顶部横幅 */
  if(state.project===DEMO_KEY && currentProjects().length===1)
    setBanner('👋 当前为演示数据。点击右上角 ⚙ 设置,关联你 GitHub 账户下的科研项目仓库。');
  else if(c&&c.errors&&Object.values(c.errors).some(e=>e&&e.kind==='ratelimit'))
    setBanner('⚠ '+errText(Object.values(c.errors).find(e=>e.kind==='ratelimit')), true);
  else setBanner(null);

  if(!c){ view.append(el('div','empty','加载中…')); return; }
  if(c.errors.meta){
    const em=el('div','empty');
    em.append(el('div','big','🚫'));
    em.append(el('div',null,`无法加载仓库 ${state.project}`));
    em.append(el('div','muted small', errText(c.errors.meta)));

    if(k==='notfound'||k==='auth'||k==='forbidden'||k==='ratelimit'){

      b.style.marginTop='16px';
      b.addEventListener('click',()=>$('#btnSettings').click());
      em.append(b);
    }
    view.append(em); return;

  ({overview:renderOverview, commits:renderCommits, results:renderResults,
    methods:renderMethods, plan:renderPlan}[state.tab]||renderOverview)();
}

/* ---- 概览 ---- */
function renderOverview(){
  const projs=currentProjects();
  const wrap=el('div');
  const isDemoOnly=projs.length===1;
  projs.forEach(p=>{
    const key=pkey(p);
    if(isDemoOnly&&key!==DEMO_KEY) return;
    const c=state.cache[key];
    const card=el('div','card proj-card');
    card.addEventListener('click',()=>{ switchProject(key); switchTab('commits'); });
    const title=el('div','proj-title');
    title.append(document.createTextNode(p.label||key));
    if(c&&c.meta&&c.meta.private) title.append(el('span','chip','🔒 私有'));
    if(key===DEMO_KEY) title.append(el('span','chip','演示'));
    card.append(title);
    if(!c){ card.append(el('div','muted small','加载中…')); wrap.append(card); loadProject(p).then(()=>{ if(state.tab==='overview') render(); }); return; }
    if(c.errors.meta){ card.append(el('div','err-inline',errText(c.errors.meta))); wrap.append(card); return; }
    if(c.meta.description) card.append(el('div','proj-desc',c.meta.description));
    const stats=el('div','proj-stats');
    /* 提交活跃 */
    const spark=el('span'); spark.append(sparkline(c.commits));
    stats.append(spark);
    const cm=el('span'); cm.append(el('b',null,String(c.commits.length)+(c.commitsDone?'':'+')), document.createTextNode(' 次提交'));
    stats.append(cm);
    /* 实验状态计数 */
    if(c.plan&&Array.isArray(c.plan.experiments)){
      const byS={};
      c.plan.experiments.forEach(e=>{ byS[e.status]=(byS[e.status]||0)+1; });
      [['running','进行中'],['planned','计划中'],['done','已完成'],['blocked','受阻']].forEach(([k,lb])=>{
        if(byS[k]){
          const s=el('span');
          s.append(el('b',null,String(byS[k])),document.createTextNode(' '+lb));
          if(k==='blocked') s.style.color='var(--crit)';
          stats.append(s);
        }
      });
    }
    const pushed=el('span','muted','更新于 '+relTime(c.meta.pushed_at));
    stats.append(pushed);
    card.append(stats);
    /* 最近结果 / 最近提交 */
    const latest=el('div','latest-line');
    const rlist=(c.results&&c.results.results)||[];
    if(rlist.length){
      const r=rlist.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))[0];
      latest.append(el('span','lb','最新结果 · '+(r.date||'')+' '));
      latest.append(document.createTextNode((r.title?r.title+':':'')+(r.summary||'')));
    }else if(c.commits.length){
      const cm0=c.commits[0];
      latest.append(el('span','lb','最新提交 · '));
      latest.append(document.createTextNode(cm0.commit.message.split('\n')[0]));
    }
    if(latest.childNodes.length) card.append(latest);
    wrap.append(card);
  });
  if(!isDemoOnly){
    const hint=el('div','muted small');
    hint.style.textAlign='center';
    hint.append(document.createTextNode('点击项目卡片查看详情 · 在 ⚙ 设置中增删项目'));
    wrap.append(hint);
  }
  view.append(wrap);
}

/* ---- 更新记录 ---- */
function renderCommits(){
  const c=cacheOf();
  if(c.errors.commits){ view.append(errorCard('提交记录', c.errors.commits)); return; }
  if(!c.commits.length){ view.append(emptyCard('📭','此分支还没有提交记录')); return; }

  /* 筛选行 */
  const fl=el('div','filters');
  const search=el('input'); search.type='search'; search.placeholder='搜索提交信息…'; search.value=state.search;
  search.addEventListener('input',debounce(()=>{ state.search=search.value; drawList(); },200));
  fl.append(search);
  const freq=new Map();
  c.commits.forEach(cm=>{ const t=parseCommitType(cm.commit.message).type; if(t) freq.set(t,(freq.get(t)||0)+1); });
  [...freq.keys()].sort((a,b)=>freq.get(b)-freq.get(a)).slice(0,10).forEach(t=>{
    const known=COMMIT_TYPES[t];
    const b=el('button','fchip'+(state.typeFilter.has(t)?' on':''), known? known.icon+' '+known.label : t.slice(1));
    b.addEventListener('click',()=>{
      if(state.typeFilter.has(t)) state.typeFilter.delete(t); else state.typeFilter.add(t);
      b.classList.toggle('on');
      drawList();
    });
    fl.append(b);
  });
  view.append(fl);

  const card=el('div','card');
  const listBox=el('div');
  card.append(listBox);
  view.append(card);

  function drawList(){
    listBox.textContent='';
    const kw=state.search.trim().toLowerCase();
    const filtered=c.commits.filter(cm=>{
      const pt=parseCommitType(cm.commit.message);
      if(state.typeFilter.size&&(!pt.type||!state.typeFilter.has(pt.type))) return false;
      if(kw&&!cm.commit.message.toLowerCase().includes(kw)) return false;
      return true;
    });
    if(!filtered.length){ listBox.append(el('div','empty','没有匹配的提交')); return; }
    /* 按日分组 */
    const groups=new Map();
    filtered.forEach(cm=>{
      const day=isoDay(parseDate(cm.commit.author.date));
      if(!groups.has(day)) groups.set(day,[]);
      groups.get(day).push(cm);
    });
    for(const [day,items] of groups){
      const g=el('div','daygroup');
      g.append(el('div','dayhead',dayLabel(day)));
      items.forEach(cm=>{
        const pt=parseCommitType(cm.commit.message);
        const row=el('div','commit');
        const rail=el('div','rail');
        const dot=el('div','dot');
        const kt=pt.type&&COMMIT_TYPES[pt.type];
        if(kt) dot.style.background=kt.color;
        rail.append(dot, el('div','line'));
        row.append(rail);
        const body=el('div','body');
        const titleRow=el('div');
        titleRow.style.display='flex'; titleRow.style.gap='8px'; titleRow.style.alignItems='baseline'; titleRow.style.flexWrap='wrap';
        const tc=typeChip(pt.type);
        if(tc) titleRow.append(tc);
        titleRow.append(el('span','title',pt.title));
        body.append(titleRow);
        const meta=el('div','meta');
        const au=cm.author&&cm.author.avatar_url;
        if(au){ const img=el('img'); img.src=au; img.alt=''; meta.append(img); }
        meta.append(document.createTextNode(cm.commit.author.name||''));
        const d=parseDate(cm.commit.author.date);
        meta.append(el('span',null,`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`));
        if(cm.html_url&&cm.html_url!=='#'){
          const a=el('a','sha',cm.sha.slice(0,7));
          a.href=cm.html_url; a.target='_blank'; a.rel='noopener';
          meta.append(a);
        }else meta.append(el('span','sha',cm.sha.slice(0,7)));
        const rest=cm.commit.message.split('\n').slice(1).join('\n').trim();
        if(rest){
          const ex=el('button','expander','详情 ▾');
          ex.addEventListener('click',()=>{
            row.classList.toggle('open');
            ex.textContent=row.classList.contains('open')?'收起 ▴':'详情 ▾';
          });
          meta.append(ex);
        }
        body.append(meta);
        if(rest) body.append(el('div','msgbody',rest));
        row.append(body);
        g.append(row);
      });
      listBox.append(g);
    }
    if(!c.commitsDone){
      const more=el('button','loadmore','加载更早的提交');
      more.addEventListener('click',async ()=>{
        more.textContent='加载中…'; more.disabled=true;
        await loadMoreCommits(currentP());
        drawList();
      });
      listBox.append(more);
    }
  }
  drawList();
}

/* ---- 实验结果 ---- */
function renderResults(){
  const c=cacheOf();
  if(c.errors.results){
    view.append(errorCard('research/results.json',
      c.errors.results.kind==='parse'? {kind:'parse', msg:c.parseMsgResults} : c.errors.results));
    return;
  }
  const list=(c.results&&c.results.results)||[];
  if(!list.length){
    view.append(guideCard('📊','还没有结果记录',
      '在仓库中创建 research/results.json 记录实验结果,仪表盘会自动渲染图表。参考模板 templates/results.example.json,或让 Claude Code 按 CLAUDE.md 规范在每次实验后自动更新。'));

  const sorted=list.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));

    const head=el('div','cardhead');

    head.append(el('h3',null,r.title||'(未命名结果)'));
    if(r.experiment) head.append(el('span','chip','实验 '+r.experiment));
    (r.tags||[]).forEach(t=>head.append(el('span','chip',t)));

    if(r.date) head.append(el('span','muted small',fmtDate(r.date,true)));
    card.append(head);
    if(r.summary) card.append(el('div','result-summary',r.summary));
    if(Array.isArray(r.metrics)&&r.metrics.length){
      const mr=el('div','metric-row');
      r.metrics.forEach(m=>{
        const box=el('div','metric');
        box.append(el('div','lbl',m.name||''));
        const v=el('div','val',m.value!=null?String(m.value):'—');
        if(m.delta){
          const isNeg=/^-/.test(String(m.delta));
          const goodDown=m.good==='down';

          if(!m.good) ds.style.color='var(--muted)';

        }
        box.append(v);
        mr.append(box);
      });
      card.append(mr);
    }
    if(r.chart&&Array.isArray(r.chart.series)){
      const cw=chartCard(r.chart);
      /* 数据表切换按钮放在标题行 */
      const tb=el('button','tbl-toggle','数据表');
      tb.addEventListener('click',()=>{ tb.textContent=cw._toggleTable()?'收起表格':'数据表'; });
      head.insertBefore(tb, head.querySelector('.muted'));
      card.append(cw);
    }
    if(Array.isArray(r.images)&&r.images.length&&!c.demo){
      const ib=el('div','result-imgs');
      r.images.forEach(pth=>{
        const fig=el('figure');
        const img=el('img'); img.alt=pth;
        repoImageURL(state.project, c.branch, pth).then(u=>{ img.src=u; })
          .catch(()=>{ fig.append(el('div','muted small','⚠ 无法加载图片 '+pth)); img.remove(); });
        fig.append(img, el('figcaption',null,pth));
        ib.append(fig);
      });
      card.append(ib);
    }
    if(r.notes) card.append(el('div','result-notes',r.notes));
    view.append(card);
  });
}

/* ---- 研究方法(CLAUDE.md) ---- */
function renderMethods(){
  const c=cacheOf();
  if(c.errors.claudemd){ view.append(errorCard('CLAUDE.md', c.errors.claudemd)); return; }
  if(!c.claudemd){
    view.append(guideCard('📘','此仓库还没有 CLAUDE.md',
      '在仓库根目录创建 CLAUDE.md,写明研究问题、方法、实验规范等。可直接使用本平台 templates/CLAUDE-template.md 模板——它同时也是 Claude Code 的项目说明,一份文件两用。'));
    return;
  }
  const {html, toc}=mdRender(c.claudemd);
  const layout=el('div','methods-layout');
  /* 目录 */
  const tocBox=el('nav','toc');
  tocBox.append(el('div','toc-h','目录'));
  toc.forEach(t=>{
    const a=el('a', t.lv===3?'l3':'', t.txt);
    a.href='#'+t.id;
    a.addEventListener('click',e=>{
      e.preventDefault();
      const target=document.getElementById(t.id);
      if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
    });
    tocBox.append(a);
  });
  layout.append(tocBox);
  const card=el('div','card');
  if(c.meta&&c.meta.html_url&&c.meta.html_url!=='#'){
    const src=el('div','small');
    src.style.textAlign='right';
    const a=el('a',null,'在 GitHub 查看原文 ↗');
    a.href=c.meta.html_url+'/blob/'+c.branch+'/CLAUDE.md'; a.target='_blank'; a.rel='noopener';
    src.append(a);
    card.append(src);
  }
  const art=el('article','md');
  art.innerHTML=html;
  /* 相对路径图片 → 仓库内容 */
  if(!c.demo) art.querySelectorAll('img[data-mdimg]').forEach(img=>{
    const src=img.getAttribute('src');
    if(/^(https?:|data:)/i.test(src)) return;
    const clean=src.replace(/^\.?\//,'');
    img.removeAttribute('src');
    repoImageURL(state.project, c.branch, clean).then(u=>{ img.src=u; }).catch(()=>{ img.alt='(无法加载 '+clean+')'; });
  });
  card.append(art);
  layout.append(card);
  view.append(layout);
}

/* ---- 实验计划 ---- */
function renderPlan(){
  const c=cacheOf();
  if(c.errors.plan){
    view.append(errorCard('research/plan.json',
      c.errors.plan.kind==='parse'? {kind:'parse', msg:c.parseMsgPlan} : c.errors.plan));
    return;
  }
  const plan=c.plan;
  if(!plan||!Array.isArray(plan.experiments)||!plan.experiments.length){
    view.append(guideCard('🗓','还没有实验计划',
      '在仓库中创建 research/plan.json 记录实验安排、预期结果与时间线。参考模板 templates/plan.example.json。'));
    return;
  }
  const exps=plan.experiments;
  /* 状态统计块 */
  const tiles=el('div','tiles');
  [['running','进行中'],['planned','计划中'],['done','已完成'],['blocked','受阻']].forEach(([k,lb])=>{
    const n=exps.filter(e=>e.status===k).length;
    const t=el('div','tile');
    t.append(el('div','lbl',lb));
    const v=el('div','val',String(n));
    if(k==='blocked'&&n>0) v.style.color='var(--crit)';
    t.append(v);
    tiles.append(t);
  });
  view.append(tiles);

  /* 甘特时间线 */
  const gcard=el('div','card');
  const gh1=el('div','cardhead');
  gh1.append(el('h3',null,'时间线'));
  gh1.append(el('span','spacer'));
  gh1.append(el('span','muted small','◆ 里程碑 · 竖线为今天'));
  gcard.append(gh1);
  const ghost=el('div');
  gcard.append(ghost);
  view.append(gcard);
  registerChart(ghost, ()=>renderGantt(ghost, exps, plan.milestones||[]));

  /* 里程碑列表 */
  if(Array.isArray(plan.milestones)&&plan.milestones.length){
    const mc=el('div','card');
    mc.append(el('h3',null,'里程碑'));
    const ml=el('div','milestones');
    plan.milestones.slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))).forEach(m=>{
      const row=el('div','ms'+(m.done?' done':''));
      row.append(el('span','msmark'));
      row.append(el('span','msdate',m.date||''));
      row.append(el('span',null,m.label||''));
      ml.append(row);
    });
    mc.append(ml);
    view.append(mc);
  }

  /* 实验明细(进行中 → 受阻 → 计划中 → 已完成) */
  const order={running:0, blocked:1, planned:2, done:3};
  const sorted=exps.slice().sort((a,b)=>(order[a.status]??2)-(order[b.status]??2)||String(a.start||'').localeCompare(String(b.start||'')));
  const listCard=el('div');
  sorted.forEach(e=>{
    const card=el('div','exp-card');
    const head=el('div','exp-head');
    if(e.id) head.append(el('span','exp-id',e.id));
    head.append(el('span','name',e.name||'(未命名实验)'));
    head.append(statusChip(e.status));
    if(e.priority==='high') head.append(el('span','prio-high','⬆ 高优先级'));
    if(e.start||e.end) head.append(el('span','exp-dates',(e.start||'?')+' → '+(e.end||'?')));
    card.append(head);
    const fields=el('div','exp-fields');
    const addF=(lbl,val,wide)=>{
      if(!val) return;
      const f=el('div','exp-field'+(wide?' wide':''));
      f.append(el('div','flbl',lbl), el('div','fval',val));
      fields.append(f);
    };
    addF('假设', e.hypothesis, true);
    addF('预期结果', e.expected);
    addF('实际结果', e.actual);
    addF('下一步', e.next, true);
    if(fields.childNodes.length) card.append(fields);
    listCard.append(card);
  });
  view.append(listCard);
  if(plan.notes){
    const nc=el('div','card');
    nc.append(el('h3',null,'备注'));
    nc.append(el('div','result-notes',plan.notes));
    view.append(nc);
  }
}

/* ---- 通用卡片 ---- */
function errorCard(what, e){
  const d=el('div','empty card');
  d.append(el('div','big','⚠️'));
  d.append(el('div',null,`加载 ${what} 失败`));
  d.append(el('div','muted small', e.kind==='parse'? ('JSON 解析失败:'+(e.msg||'')) : errText(e)));
  return d;
}
function emptyCard(icon, text){
  const d=el('div','empty card');
  d.append(el('div','big',icon));
  d.append(el('div',null,text));
  return d;
}
function guideCard(icon, title, text){
  const d=el('div','empty card');
  d.append(el('div','big',icon));
  const t=el('div',null,title); t.style.fontWeight='700'; t.style.marginBottom='6px';
  d.append(t);
  const p=el('div','muted');
  p.style.maxWidth='560px'; p.style.margin='0 auto'; p.style.textAlign='left';
  p.append(document.createTextNode(text));
  d.append(p);
  return d;
}

/* ---------------- 导航与初始化 ---------------- */
function buildTabs(){
  const nav=$('#tabs');
  nav.textContent='';
  TABS.forEach(([id,label])=>{
    const b=el('button','tab',label);
    b.dataset.tab=id;
    b.addEventListener('click',()=>switchTab(id));
    nav.append(b);
  });
}
function buildProjectSelect(){
  const sel=$('#projectSelect');
  sel.textContent='';
  currentProjects().forEach(p=>{
    const o=el('option',null,p.label||pkey(p));
    o.value=pkey(p);
    sel.append(o);
  });
  sel.value=state.project;
}
async function switchProject(key){
  state.project=key;
  $('#projectSelect').value=key;
  const p=currentP();
  if(!state.cache[key]||!state.cache[key].loaded){
    view.textContent='';
    view.append(el('div','empty','加载 '+ (p.label||key) +' …'));
    await loadProject(p);
  }
  render();
}
function switchTab(t){
  state.tab=t;
  try{ history.replaceState(null,'','#'+t); }catch(e){}
  render();
}
$('#projectSelect').addEventListener('change',e=>switchProject(e.target.value));
$('#btnRefresh').addEventListener('click',async ()=>{
  const btn=$('#btnRefresh');
  btn.classList.add('spinning'); btn.disabled=true;
  view.classList.add('loading-dim');
  await loadProject(currentP(), true);
  view.classList.remove('loading-dim');
  btn.classList.remove('spinning'); btn.disabled=false;
  render();
});

/* 主题 */
function applyTheme(t){
  if(t==='light'||t==='dark') document.documentElement.dataset.theme=t;
  else delete document.documentElement.dataset.theme;
  $('#btnTheme').textContent = t==='dark'?'☀️':'🌙';
}
$('#btnTheme').addEventListener('click',()=>{
  const cur=document.documentElement.dataset.theme ||
    (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const next=cur==='dark'?'light':'dark';
  localStorage.setItem(LS_THEME,next);
  applyTheme(next);
});
applyTheme(localStorage.getItem(LS_THEME)||'');

/* 设置对话框 */
const dlg=$('#settingsDlg');
$('#btnSettings').addEventListener('click',()=>{
  $('#setToken').value=config.token||'';
  $('#setRepos').value=config.projects.map(p=>pkey(p)+(p.branch?('#'+p.branch):'')).join('\n');
  $('#setErr').hidden=true;
  $('#repoList').style.display='none';
  dlg.showModal();
});
$('#btnCancel').addEventListener('click',()=>dlg.close());
$('#btnClearAll').addEventListener('click',()=>{
  if(!confirm('清除令牌与全部项目配置?')) return;
  localStorage.removeItem(LS_CFG);
  config={token:'', projects:[]};
  state.cache={};
  dlg.close();
  state.project=null;
  init();
});
$('#btnLoadRepos').addEventListener('click',async ()=>{
  const u=$('#setUser').value.trim();
  const errBox=$('#setErr');
  errBox.hidden=true;
  if(!u) return;
  const listBox=$('#repoList');
  listBox.style.display='block';
  listBox.textContent='加载中…';
  /* 有令牌时用 /user/repos 可包含私有仓库 */
  try{
    const saveTok=config.token;
    config.token=$('#setToken').value.trim()||config.token;
    let repos;
    try{
      repos=await gh(`/users/${encodeURIComponent(u)}/repos?sort=pushed&per_page=40`);
    } finally { config.token=saveTok; }
    listBox.textContent='';
    if(!repos.length){ listBox.textContent='(没有找到公开仓库)'; return; }
    repos.forEach(r=>{
      const lb=el('label');
      const cb=el('input'); cb.type='checkbox'; cb.value=r.full_name;
      cb.checked=$('#setRepos').value.split('\n').some(l=>l.trim().startsWith(r.full_name));
      cb.addEventListener('change',()=>{
        const lines=$('#setRepos').value.split('\n').map(s=>s.trim()).filter(Boolean);
        if(cb.checked){ if(!lines.includes(r.full_name)) lines.push(r.full_name); }
        else{ const ix=lines.findIndex(l=>l===r.full_name||l.startsWith(r.full_name+'#')); if(ix>=0) lines.splice(ix,1); }
        $('#setRepos').value=lines.join('\n');
      });
      lb.append(cb, el('span',null,r.full_name), el('span','rdesc',r.description||''));
      listBox.append(lb);
    });
  }catch(e){
    listBox.style.display='none';
    errBox.textContent=errText(e);
    errBox.hidden=false;
  }
});
$('#btnSave').addEventListener('click',()=>{
  const errBox=$('#setErr');
  const lines=$('#setRepos').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const projects=[];
  for(const ln of lines){
    const p=parseRepoLine(ln);
    if(!p){ errBox.textContent='格式错误:「'+ln+'」应为 owner/repo 或 owner/repo#分支'; errBox.hidden=false; return; }
    projects.push(p);
  }
  config.token=$('#setToken').value.trim();
  config.projects=projects;
  try{ localStorage.setItem(LS_CFG, JSON.stringify(config)); }
  catch(e){ errBox.textContent='无法保存到 localStorage'; errBox.hidden=false; return; }
  state.cache={};
  dlg.close();
  state.project=projects.length?pkey(projects[0]):null;
  init();
});

/* 初始化 */
async function init(){
  buildTabs();
  adoptProjectsFromURL();
  await loadDefaults();
  if(!state.project || !currentProjects().some(p=>pkey(p)===state.project)){
    const eff=currentProjects().filter(p=>pkey(p)!==DEMO_KEY);
    state.project=eff.length?pkey(eff[0]):DEMO_KEY;
  }
  buildProjectSelect();
  const h=location.hash.replace('#','');
  if(TABS.some(t=>t[0]===h)) state.tab=h;
  view.textContent='';
  view.append(el('div','empty','加载中…'));
  await loadProject(currentP());
  /* 概览需要其余项目,后台并行加载 */
  if(state.tab==='overview') currentProjects().forEach(p=>{ if(pkey(p)!==state.project) loadProject(p).catch(()=>{}); });
  render();
}
init();
</script>
